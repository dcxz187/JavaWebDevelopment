<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>私聊</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="private-chat-container">
            <div class="private-chat-header">
                <h1>与 <span id="recipientName"></span> 的私聊</h1>
                <a href="chat" class="back-link">返回聊天室</a>
            </div>
            
            <div class="private-messages" id="privateMessagesContainer">
                <!-- 私聊消息将通过JavaScript动态加载 -->
            </div>
            
            <div class="private-message-input">
                <label for="privateMessageInput"></label>
                <textarea id="privateMessageInput" placeholder="输入私聊消息..." onkeydown="handlePrivateKeyDown(event)"></textarea>
                <button onclick="sendPrivateMessage()">发送</button>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
