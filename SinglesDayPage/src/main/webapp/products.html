<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 - 双十一购物节</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>双十一购物节</h1>
            <h2>商品列表</h2>
        </header>

        <main>
            <div class="product-list" id="productList">
                <!-- 商品将通过JavaScript动态加载 -->
            </div>

            <div class="actions">
                <a href="cart" class="btn btn-secondary">查看购物车</a>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 加载商品数据
            loadProducts();
        });
    </script>
</body>
</html>
